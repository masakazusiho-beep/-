# note_auto の設定ファイル（クラウド実行で使われます）。
# ★テーマやキーワードを変えたいときは、ここを GitHub の画面で編集すればOK。
# ★パスワードや API キーは絶対にここに書かないこと（GitHub の Secrets に登録します）。

[content]
theme = "お菓子作りの専門知識（失敗の原因と製菓の科学を軸に）"
keywords = ["お菓子作り", "製菓", "初心者", "失敗しないコツ", "製菓の科学"]
tone = "親しみやすく、初心者にもわかりやすい丁寧な語り口"
target_chars = 2500
default_tags = ["お菓子作り", "製菓", "初心者"]
# ★このアカウント固有の方針。伸びる型（失敗の科学・裏側）に寄せるための追記指示。
#   noteで伸びる基本方針は note_auto/playbook.py に集約済み。ここはそれへの上乗せ。
extra_guidance = """
実際に反応が良かったのは「失敗の9割はコレが原因」「製菓の科学」系の"お悩み解決"記事。
中でも「失敗ばかりだった僕がお菓子の『なぜ？』を追い続けた話」はスキ率が突出して高かった
（108ビューでスキ41）。"科学的な解決"と"作り手本人の裏側ストーリー"を掛け合わせた記事が
一番強い、という実証結果が出ている。
- 半分以上は「なぜ失敗するか／どう直すか」を科学的に解く切り口にする。
- ときどき、店で働く作り手ならではの"裏側・現場の観察・本人の心情"を混ぜて独自性を出す。
  一人称の体験談（「僕が」「私が」）として書けるネタがあれば積極的に選ぶ。
- 単なるレシピ紹介は避け、出すなら必ず「失敗しない工夫」をセットにする。
"""

[generation]
model = "claude-opus-4-8"   # 記事を書くAIモデル
effort = "high"             # low | medium | high | max
# ★無料記事として運用中（2026-09-30〜）。理由：有料記事中心にしていた時期は伸び悩み、
#   「ほぼ有料」の状態が新規読者との出会い（スキ・拡散の入口）を絞っていた可能性が高いため。
#   無料に戻してからの狙い＝読まれる母数とフォロワーを増やし、信頼が育ってから有料を再検討する。
paid = false                # true = 有料記事の形（無料→🔒→濃い本編＋表/チェックリスト）

[output]
output_dir = "drafts"       # 生成記事の保存先

[note]
publish = false             # false = 下書きまで（推奨）
headless = true

[tiktok]
style = "dialogue"          # "dialogue"=会話形式（材料キャラの掛け合い） / "plain"=テロップのみ
target_seconds = 30
voice = "ja-JP-NanamiNeural"   # キャラ1（女性）
voice_b = "ja-JP-KeitaNeural"  # キャラ2（男性）
bg_color = "#111827"
text_color = "#FFFFFF"
