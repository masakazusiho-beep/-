<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お菓子作りのおすすめ道具</title>
<meta name="description" content="実際に使ってよかった、お菓子作りのおすすめ道具・材料をまとめたページ。オーブンやハンドミキサーなど。">
<meta name="theme-color" content="#C1772B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おすすめ道具">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
  :root{
    --bg:#F1EADD; --surface:#FBF7F0; --surface-2:#F5EEE1; --ink:#2B2420; --muted:#8C7F6F;
    --line:#E3D7C4; --brand:#C1772B; --brand-ink:#fff; --rakuten:#BF0000; --amazon:#E8890C;
    --tag:rgba(193,119,43,.13);
    --font:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",
           -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#191512; --surface:#221C17; --surface-2:#2A2219; --ink:#F0E8DC; --muted:#A99A87;
    --line:#372D24; --brand:#D98B3E; --rakuten:#ff5a5a; --amazon:#F2A64A; --tag:rgba(217,139,62,.18);
  }}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:600px;margin:0 auto;padding:30px 18px 64px;}
  header{text-align:center;margin-bottom:8px;}
  .kicker{font-size:12px;letter-spacing:.2em;color:var(--brand);font-weight:700;}
  h1{font-size:27px;font-weight:900;margin:8px 0 8px;letter-spacing:-.01em;line-height:1.3;}
  .lead{color:var(--muted);font-size:14.5px;margin:0 auto;max-width:34em;}

  .disclosure{margin:18px 0 22px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;color:var(--muted);font-size:12.5px;text-align:center;}

  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
  .filter{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
    font-size:13px;font-weight:700;padding:8px 15px;border-radius:999px;cursor:pointer;}
  .filter.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}

  .grid{display:flex;flex-direction:column;gap:16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;
    display:flex;gap:15px;}
  .thumb{width:64px;height:64px;flex:none;border-radius:14px;background:var(--tag);
    display:flex;align-items:center;justify-content:center;font-size:32px;}
  .body{flex:1;min-width:0;}
  .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:var(--tag);
    padding:3px 9px;border-radius:999px;margin-bottom:6px;}
  .name{font-size:18px;font-weight:700;margin:0 0 5px;}
  .blurb{font-size:14px;color:var(--muted);margin:0 0 13px;}
  .btns{display:flex;flex-wrap:wrap;gap:9px;}
  .btn{flex:1;min-width:130px;text-align:center;text-decoration:none;font-weight:700;font-size:14px;
    padding:11px 12px;border-radius:11px;color:#fff;}
  .btn.rakuten{background:var(--rakuten);}
  .btn.amazon{background:var(--amazon);}
  .btn.soon{background:transparent;color:var(--muted);border:1px dashed var(--line);cursor:default;}

  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8;}
  footer a{color:var(--brand);}
  @media (max-width:430px){h1{font-size:23px;} .card{padding:15px;gap:12px;} .thumb{width:54px;height:54px;font-size:27px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">BAKING TOOLS</div>
    <h1>お菓子作りの<br>おすすめ道具</h1>
    <p class="lead">実際に使ってよかった、お菓子作りの道具や材料をまとめました。気になったものはリンクからチェックできます。</p>
  </header>

  <div class="disclosure">
    ※当ページはアフィリエイト広告（もしもアフィリエイト等）を利用しています。
  </div>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>

  <footer>
    お菓子作りの発信をしています。<br>
    最新のレシピや失敗しないコツは <a href="#" id="noteLink">note</a> でも紹介中。
  </footer>
</div>

<script>
/* ===== 商品リスト =====
   ここに商品を足すだけで、カードが増えます。
   rakuten / amazon には、もしもで発行したリンクURLを入れてください（空なら「準備中」表示）。 */
var PRODUCTS = [
  {
    name: "コンベクションオーブン",
    cat: "オーブン",
    emoji: "🔥",
    blurb: "熱風で全体を均一に焼けるから、焼きムラが出にくく仕上がりが安定。家庭でも本格的な焼き菓子が焼けます。",
    rakuten: "",
    amazon: ""
  },
  {
    name: "ハンドミキサー",
    cat: "道具",
    emoji: "🌀",
    blurb: "メレンゲも生クリームもあっという間に泡立つ、お菓子作りの必需品。腕が疲れず時短にもなります。",
    rakuten: "",
    amazon: ""
  }
];

/* note のプロフィール/トップURL（あれば入れてね） */
var NOTE_URL = "";

(function () {
  var grid = document.getElementById("grid");
  var filtersEl = document.getElementById("filters");
  var noteLink = document.getElementById("noteLink");
  if (NOTE_URL) { noteLink.href = NOTE_URL; noteLink.target = "_blank"; noteLink.rel = "noopener"; }
  else { noteLink.removeAttribute("href"); noteLink.style.color = "inherit"; noteLink.style.textDecoration = "none"; }

  var cats = ["すべて"];
  PRODUCTS.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  var active = "すべて";

  function linkBtn(url, label, cls) {
    if (url) {
      return '<a class="btn ' + cls + '" href="' + url + '" target="_blank" rel="nofollow sponsored noopener">' + label + '</a>';
    }
    return '<span class="btn soon">準備中</span>';
  }

  function render() {
    grid.innerHTML = "";
    PRODUCTS.filter(function (p) { return active === "すべて" || p.cat === active; }).forEach(function (p) {
      var card = document.createElement("article");
      card.className = "card";
      var btns = "";
      if (!p.rakuten && !p.amazon) {
        btns = '<span class="btn soon">リンク準備中</span>';
      } else {
        btns = linkBtn(p.rakuten, "楽天で見る", "rakuten") + linkBtn(p.amazon, "Amazonで見る", "amazon");
      }
      card.innerHTML =
        '<div class="thumb">' + (p.emoji || "🧁") + '</div>' +
        '<div class="body">' +
          '<span class="tag">' + p.cat + '</span>' +
          '<h2 class="name">' + p.name + '</h2>' +
          '<p class="blurb">' + p.blurb + '</p>' +
          '<div class="btns">' + btns + '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  cats.forEach(function (c) {
    var b = document.createElement("button");
    b.className = "filter" + (c === active ? " on" : "");
    b.textContent = c;
    b.addEventListener("click", function () {
      active = c;
      Array.prototype.forEach.call(filtersEl.children, function (x) { x.classList.toggle("on", x.textContent === c); });
      render();
    });
    filtersEl.appendChild(b);
  });
  if (cats.length <= 2) filtersEl.style.display = "none";

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
