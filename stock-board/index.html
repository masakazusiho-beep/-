<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ストックボード</title>
<meta name="description" content="お店の冷凍・冷蔵・常温の在庫を場所ごとに数えて、要発注リストをコピーできる在庫アプリ。">
<meta name="theme-color" content="#2B5F7B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11181C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ストック">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Roboto+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>ストックボード</h1>
      <span class="mode local" id="mode"><span class="dot"></span><span id="modeTxt">この端末に保存</span></span>
    </div>
    <div class="stats" role="group" aria-label="絞り込み">
      <button class="stat crit" data-filter="out"><span class="k">在庫切れ</span><span class="v" id="nOut">–</span></button>
      <button class="stat warn" data-filter="low"><span class="k">要発注</span><span class="v" id="nLow">–</span></button>
      <button class="stat on" data-filter="all"><span class="k">全品目</span><span class="v" id="nAll">–</span></button>
    </div>
    <div class="tools">
      <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="品名で検索" autocomplete="off"></label>
      <button class="icon-btn" id="exportBtn" aria-label="バックアップを書き出し" title="書き出し">💾</button>
      <button class="icon-btn" id="importBtn" aria-label="バックアップを読み込み" title="読み込み">📂</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="icon-btn" id="themeBtn" aria-label="表示テーマ切替">◑</button>
    </div>
  </div>
</header>

<main><div class="wrap" id="list"></div></main>

<footer class="actions">
  <div class="wrap">
    <button class="btn grow" id="copyBtn"><span class="ic">📋</span>発注リスト</button>
    <button class="btn grow" id="copyAllBtn"><span class="ic">📄</span>全在庫</button>
    <button class="btn" id="pasteBtn" aria-label="貼り付けで一括追加"><span class="ic">📥</span></button>
    <button class="btn primary" id="addBtn">＋ 品目</button>
  </div>
</footer>

<div class="backdrop" id="backdrop" hidden></div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <h3 id="sheetTitle">品目を編集</h3>
  <div class="form">
    <div class="f"><label for="eName">品名</label><input id="eName" type="text" placeholder="例：サーモン"></div>
    <div class="grid2">
      <div class="f"><label for="eQty">数量</label><input id="eQty" type="number" step="0.1" min="0" inputmode="decimal"></div>
      <div class="f"><label for="eUnit">単位</label>
        <select id="eUnit">
          <option value="">（なし）</option><option>㌜</option><option>P</option><option>缶</option><option>袋</option>
          <option>本</option><option>個</option><option>kg</option><option>シート</option><option>枚</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="f"><label for="eLoc">場所</label><select id="eLoc"></select></div>
      <div class="f"><label for="eMin">発注点</label><input id="eMin" type="number" step="0.5" min="0" inputmode="decimal"><span class="hint">この数以下で「要発注」</span></div>
    </div>
    <div class="f"><label for="eMemo">メモ（端数・備考）</label><input id="eMemo" type="text" placeholder="例：＋3缶 / 開封済み1"></div>
    <div class="meta" id="eMeta"></div>
    <div class="foot">
      <button class="btn danger" id="eDel">削除</button>
      <button class="btn grow primary" id="eSave">保存</button>
    </div>
  </div>
</div>

<div class="sheet" id="locSheet" hidden role="dialog" aria-modal="true" aria-labelledby="locTitle">
  <div class="grab"></div>
  <h3 id="locTitle">場所を追加</h3>
  <div class="form">
    <div class="f"><label for="lName">場所の名前</label><input id="lName" type="text" placeholder="例：ドリンク冷蔵庫"></div>
    <div class="foot"><button class="btn grow primary" id="lSave">追加</button></div>
  </div>
</div>

<div class="sheet" id="pasteSheet" hidden role="dialog" aria-modal="true" aria-labelledby="pasteTitle">
  <div class="grab"></div>
  <h3 id="pasteTitle">貼り付けで一括追加</h3>
  <div class="form">
    <div class="f"><label for="pLoc">追加先の場所</label><select id="pLoc"></select></div>
    <div class="f"><label for="pText">1行に「品名 数量」で貼り付け</label>
      <textarea id="pText" placeholder="サーモン 9&#10;豆グラタン:1&#10;PBスープ 2㌜&#10;トマト缶 4㌜と3缶"></textarea>
      <span class="hint">同じ場所に同じ品名があれば「数量を更新」、なければ「新規追加」になります。</span>
    </div>
    <div class="preview" id="pPreview">貼り付けると、追加・更新の件数がここに出ます</div>
    <div class="foot"><button class="btn grow primary" id="pApply">反映する</button></div>
  </div>
</div>

<div class="sheet" id="importSheet" hidden role="dialog" aria-modal="true" aria-labelledby="importTitle">
  <div class="grab"></div>
  <h3 id="importTitle">バックアップを読み込み</h3>
  <div class="form">
    <div class="preview" id="iPreview"></div>
    <p class="hint">読み込むと、<b>今の在庫データはこのファイルの内容に置き換わります</b>。念のため先に「💾 書き出し」で今の状態を保存しておくと安心です。</p>
    <div class="foot"><button class="btn grow primary" id="iApply">置き換えて読み込む</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
