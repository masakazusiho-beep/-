[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ooda"
version = "0.1.0"
description = "A small, dependency-free implementation of Boyd's OODA loop."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ooda", "decision-loop", "control-loop", "boyd"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["ooda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
