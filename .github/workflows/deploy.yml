name: Deploy apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "bakers-note/**"
      - "stock-board/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 公開するのはアプリのフォルダだけ（Python コードや生成物は含めない）
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r bakers-note _site/bakers-note
          cp -r stock-board _site/stock-board
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>アプリ一覧</title>
          <style>
            :root{--bg:#F3F0EA;--fg:#2B2622;--muted:#7A6F63;--card:#FFFFFF;--line:#E1D9CD}
            @media (prefers-color-scheme:dark){:root{--bg:#171411;--fg:#EDE6DB;--muted:#A5988A;--card:#221E1A;--line:#3A332C}}
            body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:32px 18px}
            main{max-width:560px;margin:0 auto}
            h1{font-size:20px;margin:0 0 6px}
            p{color:var(--muted);margin:0 0 22px;font-size:14px}
            a.app{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:inherit;margin-bottom:12px}
            a.app img{width:52px;height:52px;border-radius:12px;flex:none}
            a.app b{display:block;font-size:17px}
            a.app span{color:var(--muted);font-size:13px}
          </style>
          </head>
          <body>
          <main>
            <h1>アプリ一覧</h1>
            <p>開いて「ホーム画面に追加」すると、アプリのように使えます。</p>
            <a class="app" href="stock-board/"><img src="stock-board/icons/icon.svg" alt=""><div><b>ストックボード</b><span>お店の在庫を場所ごとに数えて、発注リストをコピー</span></div></a>
            <a class="app" href="bakers-note/"><img src="bakers-note/icons/icon.svg" alt=""><div><b>ベーカーズ％ノート</b><span>製菓レシピをベーカーズ％に変換・スケール</span></div></a>
          </main>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
