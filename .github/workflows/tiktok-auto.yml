# 顔出しなしショート動画（文字＋ナレーション）を自動生成するワークフロー。
# まずは「ボタンで実行」中心（動画は生成に少し時間がかかるため）。
# 毎日にしたいときは下の schedule のコメントを外してください。

name: tiktok-auto

on:
  workflow_dispatch:        # 「Run workflow」ボタンで実行
  # schedule:
  #   - cron: "0 22 * * *"  # 毎朝 07:00 JST にしたい場合はコメントを外す

permissions:
  contents: write           # できた動画をリポジトリに保存するため
  issues: write             # 完成のお知らせ（通知）を作るため

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and Japanese / emoji fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-color-emoji

      - name: Install
        run: pip install -e ".[tiktok]"

      - name: Make a short video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m tiktok_auto make --config note_config.toml --verbose

      - name: Save the video into the repo
        id: save
        run: |
          if [ -n "$(git status --porcelain videos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add videos
            git commit -m "Add generated short video"
            git push
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -t videos/*.mp4 | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify that the video is ready (お知らせを作る)
        if: steps.save.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          file='${{ steps.save.outputs.file }}'
          name=$(basename "$file" .mp4)
          body=$(printf '@%s\n\n🎬 ショート動画ができました！\n\n下のリンクを開いて、右上のダウンロードボタンから動画を保存し、TikTok にアップしてください👇\n\nhttps://github.com/%s/blob/main/%s\n\nキャプション（説明文）は同じフォルダの %s.txt にあります。' "$OWNER" "${{ github.repository }}" "$file" "$name")
          gh issue create \
            --title "🎬 ショート動画ができました: $name" \
            --body "$body" \
            --assignee "$OWNER"

      - name: Upload video (backup)
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: videos/
