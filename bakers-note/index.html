<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ベーカーズ％ノート</title>
<meta name="description" content="製菓レシピをベーカーズ％に変換し、倍率や粉の目標量で自動スケール。レシピを保存できる、ホーム画面に追加できるアプリ。">
<meta name="theme-color" content="#B5701C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ベーカーズ％">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <img class="logo" src="icons/icon.svg" alt="" width="38" height="38">
      <div class="txt">
        <span class="eyebrow">Baker's Percentage</span>
        <h1>ベーカーズ％ノート</h1>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="表示テーマを切り替え"><span id="themeIcon">◑</span></button>
  </div>

  <!-- ===== library view ===== -->
  <section id="libView">
    <div class="lib-head">
      <h2>レシピ</h2>
      <span class="count" id="libCount"></span>
    </div>
    <div class="recipe-grid" id="recipeGrid"></div>
    <div class="lib-tools">
      <button class="text-btn" id="exportBtn">⤓ すべて書き出し</button>
      <button class="text-btn" id="importBtn">⤒ 読み込み</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>

  <!-- ===== editor view ===== -->
  <section id="edView" hidden>
    <div class="ed-head">
      <button class="back-btn" id="backBtn" aria-label="レシピ一覧へ戻る">‹ 一覧</button>
      <input class="title-in" id="titleIn" type="text" placeholder="レシピ名" aria-label="レシピ名">
      <span class="saved-flag" id="savedFlag">✓ 保存済み</span>
    </div>

    <div class="tiles">
      <div class="tile accent"><div class="k">粉類合計 (基準)</div><div class="v" id="tBase">—</div></div>
      <div class="tile"><div class="k">全体重量</div><div class="v" id="tTotal">—</div></div>
      <div class="tile"><div class="k">スケール後 粉類</div><div class="v" id="tBaseScaled">—</div></div>
      <div class="tile"><div class="k">スケール後 全体</div><div class="v" id="tTotalScaled">—</div></div>
    </div>

    <div class="warn" id="warn" hidden>「粉」列にチェックを入れて、基準（100%）になる材料を選んでください。</div>

    <div class="scaler">
      <span class="title">スケール</span>
      <div class="field">
        <label for="mult">倍率</label>
        <div class="row"><input id="mult" type="number" step="0.05" min="0" inputmode="decimal" value="1"><span class="unit">倍</span></div>
      </div>
      <div class="divider-x"></div>
      <div class="field">
        <label for="targetBase">粉類を…にする</label>
        <div class="row"><input id="targetBase" type="number" step="1" min="0" inputmode="decimal"><span class="unit">g</span></div>
      </div>
      <div class="divider-x"></div>
      <div class="field">
        <label>クイック</label>
        <div class="quick">
          <button data-m="1">×1</button><button data-m="1.5">×1.5</button>
          <button data-m="2">×2</button><button data-m="3">×3</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>材料</th><th class="num">分量</th>
              <th class="mid">粉<span style="font-weight:400;text-transform:none;letter-spacing:0"> (基準)</span></th>
              <th class="num">ベーカーズ%</th><th class="num">スケール後</th><th class="mid"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
          <tfoot>
            <tr>
              <td class="tot-label">合計</td>
              <td class="num g" id="footG">—</td><td class="mid"></td>
              <td class="num pct" id="footPct">—</td>
              <td class="num scaled" id="footScaled">—</td><td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="add-row"><button class="add-btn" id="addBtn">＋ 材料を追加</button></div>
    </div>

    <div class="ed-tools">
      <button class="text-btn" id="copyBtn">⧉ スケール後をコピー</button>
      <button class="text-btn" id="dupBtn">⧉ 複製</button>
      <button class="text-btn danger" id="delBtn">🗑 削除</button>
    </div>

    <div class="note-field">
      <label for="noteIn">メモ（作り方・気づき）</label>
      <textarea id="noteIn" placeholder="焼成温度、生地の状態、前回の反省など…"></textarea>
    </div>

    <p class="hint"><b>コツ</b><span>ベーカーズ%の数字は「粉類100gあたりのグラム数」。粉を2種類使うときは両方に「粉」チェックを入れると合計が基準になります。</span></p>
  </section>

  <footer class="note">端末内に自動保存されます。<span id="storeState"></span></footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
